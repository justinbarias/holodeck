# US1 fixture: one edge node behind a gate feeding one policy node.
# The policy table draws on both binding paths — the edge node's gated object
# (`evidence`) and a supplied fact of record (`applicant`).
name: hardship-single-gate
version: "1.0.0"
source: "Hardship Policy v4.2 §72"
input_data:
  applicant:
    schema: schemas/applicant.schema.json
nodes:
  - id: evidence
    edge:
      agent: agents/evidence.yaml
    gate:
      schema: gates/evidence.schema.json
  - id: affordability
    decision: tables/affordability.dmn.yaml
    inputs: [evidence, applicant]
