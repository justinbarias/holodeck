# Live agent for the Claude Agent SDK backend (make verify-live).
#
# Needs CLAUDE_CODE_OAUTH_TOKEN. The vectorstore and hierarchical_document
# tools also need OPENAI_API_KEY (OpenAI embeddings) and the Qdrant container;
# scripts/verify/live.py drops those tools and reports their cases as SKIP
# when either is missing. Traces go to the Aspire dashboard container.
#
# Tool types not covered on this backend:
# - skill: the Claude backend does not adapt `type: skill` tools yet
#   (docs/guides/tools.md); they would be silently ignored.
# - prompt: no runtime adapter on any backend (docs/guides/tools.md "Planned").
#
# Every case uses the multi-turn `turns:` form: single-turn cases currently
# hand code graders an empty tool_invocations list.
name: verify-live-claude
description: Live agent that exercises every Claude-backend tool type.

model:
  provider: anthropic
  name: claude-haiku-5-5
  auth_provider: oauth_token
  max_tokens: 600

instructions:
  inline: >-
    You are the HoloDeck verify live agent. Answer in one or two short
    sentences. When the user names a tool, call exactly that tool once and
    report what it returned. Use smoke_echo for "the smoke tool",
    verify_marker for "the MCP tool", verify_kb for the vault notes, verify_ledger for the ledger notes, verify_registry for the registry notes,
    verify_handbook for the operations handbook, leak_probe for "the leak
    probe", and the verify_helper subagent when the user asks for the helper.

embedding_provider:
  provider: openai
  name: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}

tools:
  - name: smoke_echo
    type: function
    description: Echo text back with a fixed marker.
    file: tools/smoke.py
    function: smoke_echo
    defer_loading: false
  - name: leak_probe
    type: function
    description: Return a fixed marker and a fake token (trace redaction probe).
    file: tools/live.py
    function: leak_probe
    defer_loading: false
  - name: verify_mcp
    type: mcp
    description: Local stdio MCP server with one marker tool.
    transport: stdio
    command: uvx
    # Pin mcp to the version in uv.lock; "./" args resolve against this file.
    args: ["--with", "mcp==1.30.0", "python", "./tools/verify_mcp_server.py"]
  - name: verify_kb
    type: vectorstore
    description: Verify vault notes (access codes, sign-in rules).
    source: rag/kb
    top_k: 2
    database:
      provider: qdrant
      connection_string: http://127.0.0.1:6333
  - name: verify_ledger
    type: vectorstore
    description: Verify ledger notes (reconciliation keys, closing dates).
    source: rag/ledger
    top_k: 2
    database:
      provider: chromadb
      connection_string: http://127.0.0.1:8765
  - name: verify_registry
    type: vectorstore
    description: Verify registry notes (registry reference codes, review dates).
    source: rag/registry
    top_k: 2
    database:
      provider: postgres
      connection_string: postgresql://postgres:holodeck@127.0.0.1:54329/holodeck
  - name: verify_handbook
    type: hierarchical_document
    description: Verify operations handbook with numbered sections.
    source: rag/handbook
    top_k: 3
    contextual_embeddings: false  # no LLM calls during ingestion
    database:
      provider: qdrant
      connection_string: http://127.0.0.1:6333

claude:
  max_turns: 10
  # The test runner uses the SDK "default" permission mode: auto-approve the
  # external MCP server and the subagent tool (Task, renamed Agent in newer CLIs).
  allowed_tools: [mcp__verify_mcp, Task, Agent]
  agents:
    verify_helper:
      description: Verify helper. Use it when the user asks for the helper.
      prompt: >-
        You are the verify helper. Reply with exactly HELPER-ACK and nothing
        else.
      tools: []
      model: inherit  # same model as the agent (claude-haiku-5-5)

observability:
  enabled: true
  service_name: holodeck-verify-live-claude
  traces:
    capture_content: true  # so the leak_probe span shows the redacted output
  metrics:
    enabled: false
  logs:
    enabled: false
  exporters:
    console:
      enabled: false
    otlp:
      enabled: true
      endpoint: http://localhost:4317  # Aspire OTLP/gRPC (container port 18889)
      protocol: grpc

test_cases:
  - name: function tool
    turns:
      - input: "Please use the smoke tool with text live-ping."
        expected_tools: [smoke_echo]
        turn_config: { tool: smoke_echo, marker: "SMOKE-TOOL-RESULT: " }
        evaluations: &tool_result
          - type: code
            grader: "verify_graders:tool_result_contains"
            name: tool_result_contains
  - name: mcp tool
    turns:
      - input: "Please use the MCP tool with text live-mcp."
        expected_tools: [verify_marker]
        turn_config: { tool: verify_marker, marker: "MCP-TOOL-RESULT: " }
        evaluations: *tool_result
  - name: vectorstore tool
    turns:
      - input: "Search the vault notes: what is the vault access code?"
        expected_tools: [verify_kb]
        turn_config: { tool: verify_kb, marker: "ZEPHYR-4417" }
        evaluations: *tool_result
  - name: chromadb vectorstore tool
    turns:
      - input: "Search the ledger notes: what is the ledger reconciliation key?"
        expected_tools: [verify_ledger]
        turn_config: { tool: verify_ledger, marker: "LUMEN-6203" }
        evaluations: *tool_result
  - name: postgres vectorstore tool
    turns:
      - input: "Search the registry notes: what is the registry reference code?"
        expected_tools: [verify_registry]
        turn_config: { tool: verify_registry, marker: "OPAL-9158" }
        evaluations: *tool_result
  - name: hierarchical document tool
    turns:
      - input: "Search the operations handbook: what is the calibration constant?"
        expected_tools: [verify_handbook]
        turn_config: { tool: verify_handbook, marker: "ORBIT-9182" }
        evaluations: *tool_result
  - name: subagent
    turns:
      # No expected_tools: the subagent tool is "Task" or "Agent" depending on
      # the bundled CLI, so the grader checks both names and the subagent_type.
      - input: "Ask the helper subagent to respond, then tell me what it said."
        turn_config: { subagent: verify_helper, marker: HELPER-ACK }
        evaluations:
          - type: code
            grader: "verify_graders:claude_subagent_ran"
            name: claude_subagent_ran
  - name: trace redaction probe
    turns:
      - input: "Please run the leak probe and tell me whether it succeeded."
        expected_tools: [leak_probe]
        turn_config: { tool: leak_probe, marker: LEAK-PROBE-OK }
        evaluations: *tool_result
