name: Scheduled verify

# Weekly dependency audit and offline end-to-end smoke (scripts/verify).
# Catches new advisories, expired audit ignores, and SDK drift between PRs.
on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3 # no floating major tags since v8

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Dependency audit
        run: make verify-deps

      - name: Offline smoke
        run: make verify-smoke

      - name: Upload smoke artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-smoke
          path: .verify/smoke/
          retention-days: 14
          include-hidden-files: true
