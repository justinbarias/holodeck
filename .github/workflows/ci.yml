name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# One self-hosted runner serves every run, so a superseded PR run only delays
# the next one. Cancel it on a new push. Push runs key on the commit SHA, so
# main and develop runs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Keep the required check name "test (3.11)" (the default would add the runner).
    name: test (${{ matrix.python-version }})
    # The required 3.11 lane stays on the self-hosted runner. The 3.13 lane runs
    # on a GitHub-hosted runner so the two lanes no longer queue behind each
    # other on the single self-hosted machine.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - python-version: "3.11"
            runner: self-hosted
          - python-version: "3.13"
            runner: ubuntu-latest
    env:
      PYTEST_XDIST_WORKERS: 8 # Match runner CPU count for optimal performance
      UV_PYTHON: ${{ matrix.python-version }} # make uv sync/run use this lane's interpreter

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history and tags for dynamic versioning

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3 # no floating major tags since v8
        with:
          # Hosted runners start empty, so cache there; self-hosted keeps ~/.cache/uv.
          enable-cache: ${{ matrix.runner != 'self-hosted' }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # No actions/cache for ~/.cache/uv on self-hosted: that runner keeps its
      # disk, and moving the 757 MB archive cost ~55s restore (+~90s save) per job.
      - name: Install dependencies
        run: uv sync --all-extras

      # METEOR reads NLTK data and never downloads it at run time. Hosted runners
      # start empty, so cache it there; self-hosted keeps ~/nltk_data on disk.
      - name: Cache NLTK data
        if: matrix.runner != 'self-hosted'
        uses: actions/cache@v6
        with:
          path: ~/nltk_data
          key: nltk-data-wordnet-punkt_tab-omw-1.4

      - name: Download NLTK data (METEOR)
        run: uv run python -m nltk.downloader wordnet punkt_tab omw-1.4

      # pre-commit hooks run once, in the required pre-commit workflow.

      - name: Run tests in parallel
        run: |
          # Run tests in parallel with explicit worker count for GitHub Actions
          # GitHub runners have 2 cores, using env.PYTEST_XDIST_WORKERS
          # Note: Coverage data is combined automatically by pytest-cov
          uv run pytest --cov --cov-branch --cov-report=xml --junitxml=junit.xml -o junit_family=legacy -n ${{ env.PYTEST_XDIST_WORKERS }}

      - name: Install bubblewrap (Claude CLI subprocess env scrubbing)
        if: matrix.python-version == '3.11'
        run: |
          if ! command -v bwrap >/dev/null; then
            SUDO=""; [ "$(id -u)" -ne 0 ] && SUDO="sudo -n"
            $SUDO apt-get update -qq
            $SUDO apt-get install -y -qq --no-install-recommends bubblewrap
          fi

      - name: Offline smoke (fake provider, both backends)
        if: matrix.python-version == '3.11'
        run: make verify-smoke

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          slug: justinbarias/holodeck

      - name: Upload test results
        if: always()
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: justinbarias/holodeck
          report_type: test_results

      - name: Security scan
        if: matrix.python-version == '3.11' # same uv.lock and src in both lanes
        run: make security
