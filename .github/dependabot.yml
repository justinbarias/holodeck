# Weekly upgrade PRs, grouped so the queue stays reviewable. Security
# updates are not grouped and open as soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
      # One PR for all major bumps: each lone PR rewrites uv.lock, so the
      # others fall behind main after every merge.
      python-major:
        update-types: ["major"]
    # Majors with a known blocker would fail the whole python-major PR.
    # Drop an entry when its migration lands. Security updates still open.
    ignore:
      - dependency-name: "mcp"  # <2 until claude-agent-sdk supports MCP 2
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"  # 3.x needs litellm and openai-agents 0.21+ together
        update-types: ["version-update:semver-major"]

  # The CopilotKit sample front end. Without this entry only security PRs
  # open, one per advisory, and the tree drifts far behind its majors.
  - package-ecosystem: "npm"
    directory: "/sample/copilotkit"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      copilotkit:
        patterns: ["@copilotkit/*"]
      npm-minor-patch:
        update-types: ["minor", "patch"]
    # CopilotKit pins exact @ag-ui/* versions, and the sample imports
    # @ag-ui/client directly. A bump on its own installs two copies and
    # `next build` fails on duplicate AbstractAgent types (#481). When a
    # CopilotKit PR lands, set @ag-ui/client to the version CopilotKit pins.
    ignore:
      - dependency-name: "@ag-ui/*"
      # TypeScript 7 (the Go compiler) breaks `npm run lint`: typescript-eslint
      # does not support it yet (#484). Drop this when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "monday"
