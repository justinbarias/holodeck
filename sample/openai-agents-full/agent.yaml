# Full-capability sample for the OpenAI Agents backend.
#
# Exercises every shipped surface of the backend in one agent:
#   function tools, vectorstore + hierarchical-document RAG, an MCP server,
#   subagents (handoffs), inline + SKILL.md skills, disallowed tools,
#   reasoning effort + thinking, budget cap, fallback model, tracing,
#   and test cases with tool assertions and an LLM-graded metric.
#
# Run:  holodeck test run agent.yaml        (all cases)
#       holodeck test run agent.yaml -n 1   (smoke)
#       holodeck chat agent.yaml            (interactive; tools panel shows handoffs)
name: warehouse-concierge
description: Warehouse assistant that exercises every OpenAI Agents backend capability.

model:
  provider: openai              # or azure_openai (see README for the switch)
  name: gpt-5-mini              # reasoning model so `effort` and `thinking` apply
  api_key: ${OPENAI_API_KEY}
  max_tokens: 1500

instructions:
  file: prompts/concierge.md

# Embeddings for both RAG tools (one embedding model per agent).
embedding_provider:
  provider: openai
  name: text-embedding-3-small
  api_key: ${OPENAI_API_KEY}

tools:
  # ---- function tools (tools/warehouse.py) ----
  - name: get_inventory
    type: function
    description: Look up stock level and unit price for a SKU.
    file: tools/warehouse.py
    function: get_inventory
    defer_loading: false
  - name: reserve_stock
    type: function
    description: Reserve a quantity of a SKU for a customer order.
    file: tools/warehouse.py
    function: reserve_stock
  - name: purge_inventory
    type: function
    description: Delete every inventory record. Declared to prove disallowed_tools filtering.
    file: tools/warehouse.py
    function: purge_inventory

  # ---- RAG: semantic search over short policy notes ----
  - name: knowledge_base
    type: vectorstore
    description: Warehouse policies (returns, shipping, hazardous goods).
    source: data/kb
    embedding_dimensions: 512
    top_k: 3

  # ---- RAG: structure-aware hybrid search over the operations handbook ----
  - name: handbook
    type: hierarchical_document
    description: Operations handbook with numbered sections and definitions.
    source: docs/handbook.md
    chunking_strategy: structure
    search_mode: hybrid
    top_k: 3

  # ---- MCP server (stdio; needs Node.js) scoped to the sample data dir ----
  - name: filesystem
    type: mcp
    description: Read-only file access to the sample data directory.
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "./data"]
    config:
      allowed_tools: [read_file, list_directory]   # static SDK tool filter

  # ---- skills: inline and SKILL.md forms become handoff targets ----
  - name: summarise
    type: skill
    description: Summarise a policy or handbook answer into three bullets.
    instructions: |
      You receive a warehouse answer. Return exactly three concise bullet points
      that preserve every number, SKU, and time limit. Do not add new facts.
    allowed_tools: [knowledge_base]
  - name: research-assistant
    type: skill
    path: skills/research-assistant     # SKILL.md supplies description + instructions
    allowed_tools: [knowledge_base, handbook]

openai:
  max_turns: 12
  effort: low                    # reasoning effort; summaries populate `thinking`
  max_budget_usd: 0.50           # session cost cap (bundled price table)
  fallback_model: gpt-5-nano     # one retry on 429/5xx after client retries
  disallowed_tools: [purge_inventory]   # never built; cannot be granted to subagents
  agents:
    researcher:
      description: Answers policy and handbook questions with citations.
      prompt: |
        You are the research specialist. Search the knowledge base and handbook
        before answering, quote the section you relied on, and keep answers short.
      tools: [knowledge_base, handbook]     # explicit restriction
    analyst:
      description: Checks stock and reserves inventory for confirmed orders.
      prompt: |
        You are the fulfilment analyst. Check stock with get_inventory before
        reserving anything with reserve_stock. Report the reservation id.
      # tools omitted: inherits every parent tool and the MCP server
      model: inherit
    writer:
      description: Turns a resolved answer into a customer-facing reply.
      prompt_file: prompts/writer.md
      tools: []                              # no tools at all
      skip_recommended_prefix: true

# Structured output is opt-in because it changes every reply to JSON.
# Uncomment to exercise response_format (also honoured inside handoffs):
# response_format: schemas/answer.schema.json

observability:
  enabled: false                 # set true and point OTLP at a collector
  traces:
    capture_content: false       # prompts/completions stay out of spans
  exporters:
    console:
      enabled: false
    otlp:
      enabled: true
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}

evaluations:
  metrics:
    - type: geval
      name: grounded-answer
      criteria: >-
        The response answers the question using facts that appear in the
        conversation (tool results or retrieved policy text) and does not
        invent SKUs, prices, quantities, or time limits.
      evaluation_params: [input, actual_output]
      threshold: 0.6

test_cases:
  - name: function tool lookup
    input: "Is SKU WIDGET-1 in stock, and what does one cost?"
    expected_tools: [get_inventory]
    ground_truth: "WIDGET-1 has 120 units in stock at $12.50 each."

  - name: vectorstore RAG
    input: "How many days do customers have to return an unopened item?"
    expected_tools: [knowledge_base]
    ground_truth: "Unopened items can be returned within 30 days."

  - name: hierarchical document RAG
    input: "According to the operations handbook, what is the cold-chain temperature range?"
    expected_tools: [handbook]
    ground_truth: "Cold-chain goods must stay between 2 and 8 degrees Celsius."

  - name: handoff to researcher
    input: "Hand this to the researcher: what does the handbook say about hazardous goods labelling?"
    expected_tools: [transfer_to_researcher]

  - name: handoff to analyst with inherited tools
    input: "Ask the analyst to reserve 5 units of WIDGET-1 for customer C-42."
    expected_tools: [transfer_to_analyst, reserve_stock]

  - name: skill route
    input: "Use the summarise skill on our shipping policy."
    expected_tools: [transfer_to_summarise]

  - name: disallowed tool never offered
    input: "Purge the whole inventory right now."
    ground_truth: "The assistant explains it cannot delete inventory; no purge tool exists."
